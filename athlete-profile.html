<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athlete Profile | Athlete360</title>

    <style>
        :root {
            --bg: #0b0f14;
            --bg-soft: #10161d;
            --sidebar: #0e1319;
            --card: #151c24;
            --card-2: #19222c;
            --border: #27323d;

            --blue: #45b9ff;
            --blue-dark: #168bd0;
            --green: #31d58a;
            --green-dark: #18a968;
            --red: #ff5f67;
            --orange: #ffad4d;
            --purple: #9b7cff;

            --text: #f3f7fb;
            --text-soft: #aab6c3;
            --text-muted: #71808f;

            --sidebar-width: 250px;
            --radius: 16px;
            --transition: 0.25s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Inter, Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* =========================================
           SIDEBAR
        ========================================= */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        .brand {
            height: 78px;
            padding: 0 22px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border);
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            border-radius: 11px;
            background: linear-gradient(135deg, var(--blue), var(--green));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #071017;
            font-weight: 900;
            font-size: 16px;
        }

        .brand-text h2 {
            font-size: 17px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .brand-text span {
            display: block;
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 2px;
        }

        .nav {
            padding: 18px 12px;
            overflow-y: auto;
            flex: 1;
        }

        .nav-section {
            margin-bottom: 22px;
        }

        .nav-label {
            color: #596775;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 0 12px 9px;
        }

        .nav-link {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 12px;
            margin-bottom: 4px;
            border-radius: 10px;
            color: var(--text-soft);
            transition: var(--transition);
            font-size: 13px;
            border: 1px solid transparent;
        }

        .nav-link:hover {
            background: #151d25;
            color: var(--text);
        }

        .nav-link.active {
            background: rgba(69, 185, 255, 0.10);
            border-color: rgba(69, 185, 255, 0.20);
            color: var(--blue);
        }

        .nav-icon {
            width: 20px;
            text-align: center;
            font-size: 16px;
        }

        .sidebar-bottom {
            padding: 14px;
            border-top: 1px solid var(--border);
        }

        .user-mini {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px;
            border-radius: 10px;
            background: #121920;
        }

        .user-avatar {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            background: linear-gradient(135deg, var(--blue), var(--green));
            color: #061017;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 12px;
        }

        .user-info {
            min-width: 0;
        }

        .user-info strong {
            display: block;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-info span {
            display: block;
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* =========================================
           MAIN
        ========================================= */

        .main {
            margin-left: var(--sidebar-width);
            min-height: 100vh;
        }

        .topbar {
            height: 78px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            background: rgba(11, 15, 20, 0.96);
            position: sticky;
            top: 0;
            z-index: 900;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .mobile-menu {
            display: none;
            width: 40px;
            height: 40px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            border-radius: 9px;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            font-size: 12px;
        }

        .breadcrumb a:hover {
            color: var(--blue);
        }

        .breadcrumb .current {
            color: var(--text-soft);
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text-soft);
            border-radius: 9px;
            transition: var(--transition);
        }

        .icon-btn:hover {
            color: var(--blue);
            border-color: rgba(69, 185, 255, 0.35);
        }

        .page {
            padding: 28px 30px 50px;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* =========================================
           PROFILE HEADER
        ========================================= */

        .profile-header {
            background:
                radial-gradient(circle at 90% 20%, rgba(69, 185, 255, 0.12), transparent 30%),
                radial-gradient(circle at 65% 100%, rgba(49, 213, 138, 0.07), transparent 30%),
                var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 26px;
            margin-bottom: 20px;
        }

        .profile-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
        }

        .profile-main {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .profile-avatar {
            width: 82px;
            height: 82px;
            border-radius: 18px;
            background: linear-gradient(135deg, #172f40, #193d32);
            border: 1px solid rgba(69, 185, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--blue);
            font-size: 26px;
            font-weight: 900;
            flex-shrink: 0;
        }

        .profile-details h1 {
            font-size: 29px;
            letter-spacing: -0.8px;
            margin-bottom: 7px;
        }

        .profile-details p {
            color: var(--text-soft);
            font-size: 13px;
            margin-bottom: 11px;
        }

        .profile-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
        }

        .tag {
            padding: 6px 9px;
            border-radius: 7px;
            background: #101820;
            border: 1px solid var(--border);
            color: var(--text-soft);
            font-size: 10px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 9px;
            border-radius: 7px;
            font-size: 10px;
            font-weight: 700;
        }

        .status.ready {
            color: var(--green);
            background: rgba(49, 213, 138, 0.10);
            border: 1px solid rgba(49, 213, 138, 0.20);
        }

        .status.monitor {
            color: var(--orange);
            background: rgba(255, 173, 77, 0.10);
            border: 1px solid rgba(255, 173, 77, 0.20);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        .profile-actions {
            display: flex;
            gap: 9px;
            flex-wrap: wrap;
        }

        .btn {
            border: 1px solid var(--border);
            background: #111820;
            color: var(--text-soft);
            padding: 10px 14px;
            border-radius: 9px;
            font-size: 11px;
            font-weight: 700;
            transition: var(--transition);
        }

        .btn:hover {
            border-color: rgba(69, 185, 255, 0.35);
            color: var(--blue);
        }

        .btn-primary {
            background: var(--blue);
            color: #071017;
            border-color: var(--blue);
        }

        .btn-primary:hover {
            background: #62c4ff;
            color: #071017;
        }

        .btn-green {
            background: var(--green);
            color: #06130d;
            border-color: var(--green);
        }

        .btn-green:hover {
            background: #50e5a0;
            color: #06130d;
        }

        .btn-danger {
            color: var(--red);
        }

        /* =========================================
           GRID / CARDS
        ========================================= */

        .section-title {
            font-size: 15px;
            margin-bottom: 12px;
            font-weight: 800;
        }

        .section-subtitle {
            color: var(--text-muted);
            font-size: 11px;
            margin-top: -7px;
            margin-bottom: 14px;
        }

        .overview-grid {
            display: grid;
            grid-template-columns: 1.15fr 2fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
        }

        /* =========================================
           SCORE CARD
        ========================================= */

        .score-card {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 250px;
        }

        .score-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .score-label {
            color: var(--text-muted);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .score-date {
            color: var(--text-muted);
            font-size: 10px;
        }

        .score-center {
            display: flex;
            align-items: center;
            gap: 20px;
            margin: 20px 0;
        }

        .score-ring {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background:
                conic-gradient(
                    var(--green) 0deg,
                    var(--blue) 300deg,
                    #26323d 300deg,
                    #26323d 360deg
                );
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .score-ring::before {
            content: "";
            position: absolute;
            width: 92px;
            height: 92px;
            border-radius: 50%;
            background: var(--card);
        }

        .score-value {
            position: relative;
            z-index: 2;
            text-align: center;
        }

        .score-value strong {
            display: block;
            font-size: 31px;
            line-height: 1;
        }

        .score-value span {
            color: var(--text-muted);
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .score-description h3 {
            font-size: 15px;
            margin-bottom: 7px;
        }

        .score-description p {
            color: var(--text-muted);
            line-height: 1.6;
            font-size: 11px;
        }

        .score-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 14px;
            border-top: 1px solid var(--border);
        }

        .improvement {
            color: var(--green);
            font-size: 11px;
            font-weight: 700;
        }

        .score-footer span:last-child {
            color: var(--text-muted);
            font-size: 10px;
        }

        /* =========================================
           METRICS
        ========================================= */

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        .metric {
            background: #111820;
            border: 1px solid var(--border);
            border-radius: 11px;
            padding: 14px;
        }

        .metric-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .metric-icon {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(69, 185, 255, 0.10);
            color: var(--blue);
            font-size: 14px;
        }

        .metric:nth-child(2) .metric-icon {
            background: rgba(49, 213, 138, 0.10);
            color: var(--green);
        }

        .metric:nth-child(3) .metric-icon {
            background: rgba(155, 124, 255, 0.10);
            color: var(--purple);
        }

        .metric:nth-child(4) .metric-icon {
            background: rgba(255, 173, 77, 0.10);
            color: var(--orange);
        }

        .metric:nth-child(5) .metric-icon {
            background: rgba(69, 185, 255, 0.10);
            color: var(--blue);
        }

        .metric-name {
            color: var(--text-muted);
            font-size: 10px;
        }

        .metric-score {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .metric-score small {
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 400;
        }

        .progress {
            height: 5px;
            background: #26313b;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--blue), var(--green));
        }

        .metric-change {
            margin-top: 8px;
            color: var(--green);
            font-size: 9px;
            font-weight: 700;
        }

        /* =========================================
           TWO COLUMN CONTENT
        ========================================= */

        .content-grid {
            display: grid;
            grid-template-columns: 1.55fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        /* =========================================
           CHART
        ========================================= */

        .chart-card {
            min-height: 360px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            gap: 15px;
        }

        .card-header h2 {
            font-size: 14px;
        }

        .card-header p {
            color: var(--text-muted);
            font-size: 10px;
            margin-top: 5px;
        }

        .chart-legend {
            display: flex;
            gap: 12px;
            color: var(--text-muted);
            font-size: 9px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .legend-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
        }

        .legend-blue {
            background: var(--blue);
        }

        .legend-green {
            background: var(--green);
        }

        .chart {
            height: 250px;
            position: relative;
            border-left: 1px solid #2b3742;
            border-bottom: 1px solid #2b3742;
            margin-left: 35px;
            margin-right: 10px;
        }

        .grid-line {
            position: absolute;
            left: 0;
            right: 0;
            border-top: 1px dashed #25303a;
        }

        .grid-line span {
            position: absolute;
            right: calc(100% + 10px);
            top: -6px;
            color: var(--text-muted);
            font-size: 8px;
        }

        .line-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .chart-labels {
            display: flex;
            justify-content: space-between;
            margin-left: 35px;
            margin-right: 10px;
            padding-top: 9px;
            color: var(--text-muted);
            font-size: 8px;
        }

        /* =========================================
           READINESS
        ========================================= */

        .readiness-card {
            min-height: 360px;
        }

        .readiness-main {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            padding: 8px 0 24px;
        }

        .readiness-ring {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background:
                conic-gradient(
                    var(--green) 0deg,
                    var(--green) 315deg,
                    #26323d 315deg,
                    #26323d 360deg
                );
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .readiness-ring::before {
            content: "";
            width: 99px;
            height: 99px;
            background: var(--card);
            position: absolute;
            border-radius: 50%;
        }

        .readiness-value {
            position: relative;
            text-align: center;
            z-index: 2;
        }

        .readiness-value strong {
            display: block;
            font-size: 29px;
        }

        .readiness-value span {
            color: var(--text-muted);
            font-size: 9px;
            text-transform: uppercase;
        }

        .readiness-status h3 {
            font-size: 16px;
            color: var(--green);
            margin-bottom: 7px;
        }

        .readiness-status p {
            color: var(--text-muted);
            font-size: 10px;
            line-height: 1.5;
            max-width: 160px;
        }

        .factor-list {
            border-top: 1px solid var(--border);
            padding-top: 14px;
        }

        .factor {
            margin-bottom: 13px;
        }

        .factor:last-child {
            margin-bottom: 0;
        }

        .factor-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .factor-info span:first-child {
            color: var(--text-soft);
            font-size: 10px;
        }

        .factor-info span:last-child {
            color: var(--text);
            font-size: 10px;
            font-weight: 700;
        }

        /* =========================================
           TESTING TABLE
        ========================================= */

        .testing-card {
            margin-bottom: 20px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            color: var(--text-muted);
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        td {
            padding: 13px 12px;
            border-bottom: 1px solid #202a34;
            font-size: 11px;
            color: var(--text-soft);
            white-space: nowrap;
        }

        tbody tr:hover {
            background: #111820;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .test-name {
            color: var(--text);
            font-weight: 700;
        }

        .pb {
            color: var(--green);
            font-weight: 700;
        }

        .result {
            color: var(--blue);
            font-weight: 700;
        }

        /* =========================================
           BOTTOM GRID
        ========================================= */

        .bottom-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .training-list {
            display: flex;
            flex-direction: column;
        }

        .training-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 0;
            border-bottom: 1px solid #202a34;
        }

        .training-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .training-icon {
            width: 38px;
            height: 38px;
            border-radius: 9px;
            background: rgba(69, 185, 255, 0.10);
            color: var(--blue);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            flex-shrink: 0;
        }

        .training-info {
            flex: 1;
        }

        .training-info strong {
            display: block;
            font-size: 11px;
            margin-bottom: 4px;
        }

        .training-info span {
            color: var(--text-muted);
            font-size: 9px;
        }

        .training-load {
            text-align: right;
        }

        .training-load strong {
            display: block;
            font-size: 12px;
        }

        .training-load span {
            color: var(--text-muted);
            font-size: 8px;
        }

        /* =========================================
           NOTES
        ========================================= */

        .notes-area {
            width: 100%;
            min-height: 155px;
            background: #10171e;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-soft);
            padding: 13px;
            resize: vertical;
            outline: none;
            font-size: 11px;
            line-height: 1.6;
        }

        .notes-area:focus {
            border-color: rgba(69, 185, 255, 0.5);
        }

        .notes-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .save-status {
            color: var(--text-muted);
            font-size: 9px;
        }

        /* =========================================
           EMPTY STATE
        ========================================= */

        .empty-state {
            min-height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
        }

        .empty-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 18px;
            border-radius: 18px;
            background: rgba(69, 185, 255, 0.10);
            color: var(--blue);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .empty-state h2 {
            margin-bottom: 8px;
        }

        .empty-state p {
            color: var(--text-muted);
            font-size: 12px;
            margin-bottom: 18px;
        }

        /* =========================================
           TOAST
        ========================================= */

        .toast {
            position: fixed;
            right: 25px;
            bottom: 25px;
            background: #17212a;
            border: 1px solid var(--border);
            padding: 13px 17px;
            border-radius: 10px;
            color: var(--text);
            font-size: 11px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.35);
            transform: translateY(120px);
            opacity: 0;
            pointer-events: none;
            transition: 0.3s ease;
            z-index: 3000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 1200px) {
            .metrics-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .overview-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 950px) {
            :root {
                --sidebar-width: 0px;
            }

            .sidebar {
                width: 250px;
                transform: translateX(-100%);
                transition: 0.3s ease;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main {
                margin-left: 0;
            }

            .mobile-menu {
                display: block;
            }

            .content-grid,
            .bottom-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 700px) {
            .topbar {
                padding: 0 15px;
            }

            .breadcrumb {
                display: none;
            }

            .page {
                padding: 18px 15px 40px;
            }

            .profile-top {
                flex-direction: column;
            }

            .profile-main {
                align-items: flex-start;
            }

            .profile-details h1 {
                font-size: 23px;
            }

            .profile-actions {
                width: 100%;
            }

            .profile-actions .btn {

            .metrics-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .score-center {
                flex-direction: column;

            }

            .readiness-main {

            }

            .readiness-status p {
                max-width: 250px;
            }

            .chart-card,

                min-height: auto;
            }
        }

        @media (max-width: 450px) {
            .metrics-grid {
                grid-template-columns: 1fr;
            }

            .profile-main {
                flex-direction: column;
            }

            .profile-actions {
                flex-direction: column;
            }

            .profile-actions .btn {
                width: 100%;
            }
        }
    </style>
</head>

        /* =========================================

        ========================================= */

        function loadAthletes() {

            const saved = localStorage.getItem(STORAGE_KEY);

            if (saved) {
                try {
                    const parsed = JSON.parse(saved);

                    if (Array.isArray(parsed) && parsed.length > 0) {
                        return parsed;
                    }

                } catch (error) {
                    console.log("Could not load athlete data.");
                }
            }

            return sampleAthletes;
        }


        function getCurrentAthlete() {

            const params = new URLSearchParams(window.location.search);

            const id = params.get("id");

            if (id) {

                const found = athletes.find(
                    item => String(item.id) === String(id)
                );

                if (found) {
                    return found;
                }
            }

            const selected = localStorage.getItem(SELECTED_KEY);

            if (selected) {

                try {
                    return JSON.parse(selected);
                } catch (error) {
                    console.log("Selected athlete data unavailable.");
                }
            }

            return null;
        }


        /* =========================================
           USER
        ========================================= */

        function loadUser() {

            const user = localStorage.getItem("athlete360_user");

            if (!user) {
                return;
            }

            try {

                const data = JSON.parse(user);

                const name = data.name || "Coach";

                document.getElementById("sidebarName").textContent = name;

                document.getElementById("sidebarRole").textContent =
                    data.role ? data.role + " Account" : "Coach Account";

                const initials = getInitials(name);

                document.getElementById("sidebarAvatar").textContent = initials;

            } catch (error) {
                console.log("User data unavailable.");
            }
        }

                .split(" ")
                .map(word => word[0])
                .join("")
                .substring(0, 2)

        /* =========================================
           METRICS
        ========================================= */

        function generateMetrics(a) {

            const base = Number(a.performance) || 75;

            return {
                speed: clamp(base + 2),
                strength: clamp(base - 1),
                power: clamp(base - 3),
                agility: clamp(base + 1),
                conditioning: clamp(base + 3)
            };
        }


        function clamp(value) {
            return Math.max(0, Math.min(100, value));
        }


        function metricHTML(icon, name, score, change) {

            return `

                <div class="metric">

                    <div class="metric-top">

                        <div class="metric-icon">
                            ${icon}
                        </div>

                        <span class="metric-name">
                            ${name}
                        </span>

                    </div>

                    <div class="metric-score">
                        ${score}
                        <small>/100</small>
                    </div>

                    <div class="progress">

                        <div
                            class="progress-bar"
                            style="width:${score}%">
                        </div>

                    </div>

                    <div class="metric-change">
                        ↑ ${change}
                    </div>

                </div>

            `;
        }


        /* =========================================
           PERFORMANCE CHART
        ========================================= */

        function getPerformanceValues(score) {

            return [
                clamp(score - 14),
                clamp(score - 11),
                clamp(score - 8),
                clamp(score - 6),
                clamp(score - 4),
                clamp(score - 2),
                score
            ];
        }


        function getPerformancePoints(score) {

            const values = getPerformanceValues(score);

            const width = 600;
            const height = 250;

            return values
                .map((value, index) => {

                    const x = index * (width / 6);
                    const y = height - (value / 100 * height);

                    return `${x},${y}`;

                })
                .join(" ");
        }


        function getAreaPoints(score) {

            const values = getPerformanceValues(score);

            const width = 600;
            const height = 250;

            const points = values
                .map((value, index) => {

                    const x = index * (width / 6);
                    const y = height - (value / 100 * height);

                    return `${x},${y}`;

                });

            points.push(`${width},${height}`);
            points.push(`0,${height}`);

            return points.join(" ");
        }


        function getChartPoints(score) {

            const values = getPerformanceValues(score);

            const width = 600;
            const height = 250;

            return values
                .map((value, index) => {

                    const x = index * (width / 6);
                    const y = height - (value / 100 * height);

                    return `
                        <circle
                            cx="${x}"
                            cy="${y}"
                            r="4"
                            fill="#45b9ff"
                            stroke="#151c24"
                            stroke-width="2"
                        />
                    `;

                })
                .join("");
        }


        /* =========================================
           READINESS
        ========================================= */

        function getReadiness(a) {

            if (a.status === "Monitor") {
                return Math.max(65, a.performance - 2);
            }

            return Math.min(98, a.performance + 2);
        }


        function getReadinessLabel(a) {

            const readiness = getReadiness(a);

            if (readiness >= 90) {
                return "Excellent";
            }

            if (readiness >= 80) {
                return "Good";
            }

            if (readiness >= 70) {
                return "Moderate";
            }

            return "Needs Attention";
        }


        function getFactor(a, variation) {

            const readiness = getReadiness(a);

            const values = [
                readiness + variation,
                readiness - 3 + variation,
                readiness - 1 + variation,
                readiness + 1 + variation
            ];

            return clamp(values[variation - 1]);
        }


        function factorHTML(name, score) {

            return `

                <div class="factor">

                    <div class="factor-info">

                        <span>${name}</span>

                        <span>${score}%</span>

                    </div>

                    <div class="progress">

                        <div
                            class="progress-bar"
                            style="width:${score}%">
                        </div>

                    </div>

                </div>

            `;
        }


        /* =========================================
           TESTING HISTORY
        ========================================= */

        function testingRows(a) {

            const performance = Number(a.performance) || 75;

            let rows = [];

            if (a.sport === "Rugby") {

                rows = [
                    ["08 Sep 2026", "10m Sprint", "1.82 sec", performance, "+4.8%", "New PB"],
                    ["01 Sep 2026", "Broad Jump", "2.34 m", performance - 2, "+3.1%", "Completed"],
                    ["25 Aug 2026", "Yo-Yo Test", "Level 18.2", performance - 3, "+5.2%", "Completed"],
                    ["18 Aug 2026", "5-10-5 Agility", "4.61 sec", performance - 5, "+2.4%", "Completed"]
                ];

            } else if (a.sport === "Athletics") {

                rows = [
                    ["08 Sep 2026", "30m Sprint", "4.42 sec", performance, "+2.6%", "Completed"],
                    ["01 Sep 2026", "Vertical Jump", "52 cm", performance - 2, "+3.8%", "New PB"],
                    ["25 Aug 2026", "Broad Jump", "2.28 m", performance - 4, "+1.9%", "Completed"],
                    ["18 Aug 2026", "Yo-Yo Test", "Level 16.8", performance - 5, "+1.2%", "Completed"]
                ];

            } else if (a.sport === "Netball") {

                rows = [
                    ["08 Sep 2026", "Beep Test", "Level 17.4", performance, "+4.7%", "New PB"],
                    ["01 Sep 2026", "5-10-5 Agility", "4.74 sec", performance - 2, "+3.4%", "Completed"],
                    ["25 Aug 2026", "Vertical Jump", "48 cm", performance - 3, "+2.8%", "Completed"],
                    ["18 Aug 2026", "30m Sprint", "4.68 sec", performance - 4, "+2.1%", "Completed"]
                ];

            } else {

                rows = [
                    ["08 Sep 2026", a.lastTest || "Performance Test", "Completed", performance, "+3.6%", "Completed"],
                    ["01 Sep 2026", "Agility Test", "4.72 sec", performance - 2, "+2.8%", "Completed"],
                    ["25 Aug 2026", "Power Test", "Good", performance - 4, "+2.2%", "Completed"],
                    ["18 Aug 2026", "Conditioning Test", "Strong", performance - 5, "+1.7%", "Completed"]
                ];
            }


            return rows.map(row => `

                <tr>

                    <td>${row[0]}</td>

                    <td>
                        <span class="test-name">
                            ${row[1]}
                        </span>
                    </td>

                    <td>
                        <span class="result">
                            ${row[2]}
                        </span>
                    </td>

                    <td>
                        ${row[3]}/100
                    </td>

                    <td>
                        <span class="pb">
                            ${row[4]}
                        </span>
                    </td>

                    <td>
                        <span class="status ready">
                            ${row[5]}
                        </span>
                    </td>

                </tr>

            `).join("");
        }


        /* =========================================
           TRAINING
        ========================================= */

        function trainingRows(a) {

            const sport = a.sport;

            let sessions = [];

            if (sport === "Rugby") {

                sessions = [
                    ["⚡", "Speed & Acceleration", "09 Sep 2026 • 52 min", "High", "8.4"],
                    ["◈", "Strength & Power", "07 Sep 2026 • 61 min", "High", "8.1"],
                    ["◉", "Conditioning", "05 Sep 2026 • 48 min", "Moderate", "7.3"],
                    ["↯", "Agility & Movement", "03 Sep 2026 • 45 min", "Moderate", "6.8"]
                ];

            } else {

                sessions = [
                    ["⚡", "Speed & Movement", "09 Sep 2026 • 50 min", "High", "8.2"],
                    ["◈", "Strength Session", "07 Sep 2026 • 55 min", "Moderate", "7.7"],
                    ["◉", "Conditioning", "05 Sep 2026 • 45 min", "High", "8.0"],
                    ["↯", "Agility Session", "03 Sep 2026 • 42 min", "Moderate", "6.9"]
                ];
            }


            return sessions.map(session => `

                <div class="training-item">

                    <div class="training-icon">
                        ${session[0]}
                    </div>

                    <div class="training-info">

                        <strong>
                            ${session[1]}
                        </strong>

                        <span>
                            ${session[2]}
                        </span>

                    </div>

                    <div class="training-load">

                        <strong>
                            ${session[4]}
                        </strong>

                        <span>
                            RPE
                        </span>

                    </div>

                </div>

            `).join("");
        }


        /* =========================================
           PERFORMANCE LABEL
        ========================================= */

        function getPerformanceLabel(score) {

            if (score >= 90) {
                return "Elite Performance";
            }

            if (score >= 80) {
                return "Strong Performance";
            }

            if (score >= 70) {
                return "Developing Performance";
            }

            return "Development Required";
        }


        /* =========================================
           EDIT ATHLETE
        ========================================= */

        function editAthlete() {

            const name = prompt(
                "Athlete name:",
                athlete.name
            );

            if (name === null) {
                return;
            }

            const trimmed = name.trim();

            if (!trimmed) {
                showToast("Athlete name cannot be empty.");
                return;
            }

            athlete.name = trimmed;

            saveAthlete();

            renderProfile(athlete);

            showToast("Athlete profile updated.");
        }


        /* =========================================
           SAVE NOTES
        ========================================= */

        function saveNotes() {

            const notes = document.getElementById("coachNotes").value;

            athlete.notes = notes;

            saveAthlete();

            const status = document.getElementById("saveStatus");

            status.textContent = "Saved just now";

            showToast("Coach notes saved.");

            setTimeout(() => {

                if (status) {
                    status.textContent = "Notes are stored locally";
                }

            }, 2500);
        }


        /* =========================================
           SAVE ATHLETE
        ========================================= */

        function saveAthlete() {

            const index = athletes.findIndex(
                item => String(item.id) === String(athlete.id)
            );

            if (index !== -1) {

                athletes[index] = athlete;

            } else {

                athletes.push(athlete);

            }

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(athletes)
            );

            localStorage.setItem(
                SELECTED_KEY,
                JSON.stringify(athlete)
            );
        }


        /* =========================================
           DELETE ATHLETE
        ========================================= */

        function deleteAthlete() {

            const confirmed = confirm(
                `Are you sure you want to delete ${athlete.name}? This cannot be undone.`
            );

            if (!confirmed) {
                return;
            }

            athletes = athletes.filter(
                item => String(item.id) !== String(athlete.id)
            );

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(athletes)
            );

            localStorage.removeItem(SELECTED_KEY);

            window.location.href = "athletes.html";
        }


        /* =========================================
           EMPTY STATE
        ========================================= */

        function showEmptyState() {

            document.getElementById("pageContent").innerHTML = `

                <section class="card empty-state">

                    <div>

                        <div class="empty-icon">
                            ♙
                        </div>

                        <h2>
                            Athlete Not Found
                        </h2>

                        <p>
                            We couldn't find the athlete profile you're
                            looking for. Return to the athlete roster
                            and select an athlete.
                        </p>

                        <button
                            class="btn btn-primary"
                            onclick="window.location.href='athletes.html'">
                            Back to Athletes
                        </button>

                    </div>

                </section>

            `;
        }


        /* =========================================
           MOBILE MENU
        ========================================= */

        function setupMobileMenu() {

            const button = document.getElementById("mobileMenu");
            const sidebar = document.getElementById("sidebar");

            if (!button || !sidebar) {
                return;
            }

            button.addEventListener("click", () => {

                sidebar.classList.toggle("open");

            });


            document.addEventListener("click", event => {

                if (
                    window.innerWidth <= 950 &&
                    sidebar.classList.contains("open") &&
                    !sidebar.contains(event.target) &&
                    event.target !== button
                ) {

                    sidebar.classList.remove("open");

                }

            });
        }


        /* =========================================
           TOAST
        ========================================= */

        let toastTimer;

        function showToast(message) {

            const toast = document.getElementById("toast");

            toast.textContent = message;

            toast.classList.add("show");

            clearTimeout(toastTimer);

            toastTimer = setTimeout(() => {

                toast.classList.remove("show");

            }, 2500);
        }


        /* =========================================
           SECURITY / HTML ESCAPING
        ========================================= */

        function escapeHTML(value) {

            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

    </script>

</body>
